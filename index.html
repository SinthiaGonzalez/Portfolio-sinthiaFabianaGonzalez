<!doctype html>

<head>

<title>Sinthia González · Desarrolladora Web Full Stack</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  :root { --bg:#F5F0EA; --bg2:#EAE0D5; --olive:#4A5437; --olive2:#5D6C52; --terra:#B4673F; --ink:#2b2b28; --muted:#6b6b63; --line:#D6C7B7; --card:#F9F6F2; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body { font-family: "DM Sans", system-ui, sans-serif; background: var(--bg); color: var(--ink); overflow-x: hidden; }
  .wrap { min-height: 100vh; display: grid; grid-template-columns: 1.1fr .9fr; align-items: center; gap: 40px; max-width: 1100px; margin: 0 auto; padding: 48px 24px; position: relative; }
  .blob { position: absolute; border-radius: 50%; filter: blur(2px); z-index: 0; }
  .b1 { width: 420px; height: 420px; background: var(--bg2); right: -60px; top: 50%; transform: translateY(-50%); border-radius: 46% 54% 42% 58% / 55% 45% 55% 45%; animation: morph 12s ease-in-out infinite alternate; }
  .b2 { width: 120px; height: 120px; background: var(--terra); opacity: .18; left: 4%; top: 10%; animation: float 7s ease-in-out infinite alternate; }
  .b3 { width: 70px; height: 70px; background: var(--olive2); opacity: .2; left: 44%; bottom: 8%; animation: float 9s ease-in-out infinite alternate-reverse; }
  .text, .photo { position: relative; z-index: 1; }
  .tag { display: inline-block; font-size: 13px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--terra); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; margin-bottom: 22px; }
  h1 { font-family: "DM Serif Display", Georgia, serif; font-weight: 400; color: var(--olive); font-size: clamp(40px, 6vw, 66px); line-height: 1.02; }
  .role { font-size: clamp(18px, 2.2vw, 22px); font-weight: 500; color: var(--terra); margin: 12px 0 20px; }
  p { font-size: 17px; line-height: 1.6; color: var(--muted); max-width: 520px; }
  .links { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 700; font-size: 15px; padding: 12px 20px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--olive); transition: transform .2s, background .2s; }
  .btn:hover { transform: translateY(-2px); background: #fff; }
  .btn.primary { background: var(--olive); color: #fff; border-color: var(--olive); }
  .btn.primary:hover { background: #3d462d; }
  .btn svg { width: 18px; height: 18px; }
  .photo { display: flex; justify-content: center; }
  .photo img { width: min(360px, 80%); height: auto; animation: float 6s ease-in-out infinite alternate; filter: drop-shadow(0 18px 24px rgba(74,84,55,.15)); }
  footer { position: relative; z-index: 1; text-align: center; font-size: 13px; color: var(--muted); padding: 0 24px 28px; margin-top: -40px; }
  @keyframes float { from { transform: translateY(0); } to { transform: translateY(-14px); } }
  @keyframes morph { from { border-radius: 46% 54% 42% 58% / 55% 45% 55% 45%; } to { border-radius: 58% 42% 55% 45% / 45% 58% 42% 55%; } }
  @media (max-width: 800px) {
    .wrap { grid-template-columns: 1fr; text-align: center; padding-top: 36px; gap: 20px; }
    .photo { order: -1; }
    .photo img { width: min(240px, 65%); }
    .b1 { width: 300px; height: 300px; right: 50%; top: 170px; transform: translateX(50%); }
    p { margin: 0 auto; }
    .links { justify-content: center; }
    footer { margin-top: 0; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
